<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>rs — operator console</title>
<style>
  :root{color-scheme:dark}
  body{font:14px/1.45 ui-monospace,Consolas,monospace;background:#0d1117;color:#c9d1d9;margin:0;padding:16px}
  h1{font-size:16px;color:#58a6ff;margin:0 0 12px}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;max-width:1100px;margin:0 auto}
  .card{background:#161b22;border:1px solid #30363d;border-radius:8px;padding:12px}
  .card h2{font-size:13px;margin:12px 0 8px;color:#8b949e;text-transform:uppercase}
  input,button{font:inherit;background:#0d1117;color:#c9d1d9;border:1px solid #30363d;border-radius:6px;padding:6px 10px}
  button{cursor:pointer}button:hover{border-color:#58a6ff}
  table{width:100%;border-collapse:collapse}
  th,td{text-align:left;padding:4px 6px;border-bottom:1px solid #21262d;font-size:12px}
  tr.sel{background:#1f6feb44}tr:hover{cursor:pointer;background:#1f6feb22}
  #log,#out{overflow-y:auto;font-size:12px;white-space:pre-wrap;background:#0d1117;border-radius:6px;padding:8px}
  #log{height:200px}#out{height:150px}
  .row{display:flex;gap:8px;margin-bottom:8px;flex-wrap:wrap}
  .muted{color:#8b949e}
</style>
</head>
<body>
<h1>rs — operator console (web)</h1>
<div class="grid">
  <div class="card">
    <h2>control</h2>
    <div class="row">
      <input id="token" type="password" placeholder="operator token" style="flex:1">
      <button onclick="refresh()">reload</button>
      <span id="state" class="muted">offline</span>
    </div>
    <div class="row">
      <input id="cmd" placeholder="command" style="flex:1">
      <button onclick="exec('shell')">exec</button>
      <button onclick="exec('sysinfo')">sysinfo</button>
      <button onclick="kill()">kill</button>
    </div>
    <div id="out" class="muted">no session selected</div>
  </div>
  <div class="card">
    <h2>sessions</h2>
    <table>
      <thead><tr><th>#</th><th>sid</th><th>os</th><th>user</th><th>state</th></tr></thead>
      <tbody id="tbody"></tbody>
    </table>
    <h2>events</h2>
    <div id="log" class="muted"></div>
  </div>
</div>
<script>
let token = "", sel = null, sseAbort = null;
const $ = id => document.getElementById(id);
const CT = {"Content-Type": "application/json"};

function auth() {
  token = $("token").value.trim();
  if (!token) { log("set the operator token first"); return false; }
  return true;
}

async function api(method, path, body) {
  const r = await fetch(path, {
    method,
    headers: {...CT, "Authorization": "Bearer " + token, "X-RS-Operator": "webui"},
    body: body ? JSON.stringify(body) : undefined,
  });
  if (r.status >= 400) {
    throw new Error(method + " " + path + " → " + r.status + " " + (await r.text()));
  }
  return r;
}

async function refresh() {
  if (!auth()) return;
  try {
    const list = await (await api("GET", "/v1/sessions")).json();
    render(list);
    $("state").textContent = "online";
  } catch (e) { $("state").textContent = "offline"; log(e.message); }
}

function render(list) {
  const tb = $("tbody");
  tb.innerHTML = "";
  list.forEach((s, i) => {
    const tr = document.createElement("tr");
    const td = (v) => { const d = document.createElement("td"); d.textContent = v; return d; };
    tr.append(td(i + 1), td(s.sid), td(s.os + "/" + s.arch), td(s.user), td(s.state));
    tr.onclick = () => {
      sel = s.sid;
      document.querySelectorAll("#tbody tr").forEach(x => x.classList.remove("sel"));
      tr.classList.add("sel");
      $("out").textContent = "selected " + s.sid;
    };
    tb.appendChild(tr);
  });
  if (!list.length) { $("out").textContent = "no live sessions"; }
}

function log(msg) {
  const d = document.createElement("div");
  d.textContent = "[" + new Date().toLocaleTimeString() + "] " + msg;
  $("log").prepend(d);
}

async function exec(kind) {
  if (!sel) { log("select a session first"); return; }
  if (!auth()) return;
  const spec = kind === "shell"
    ? {kind: "shell", args: {cmd: $("cmd").value}, timeout: 60}
    : {kind: kind, timeout: 60};
  if (kind === "shell" && !$("cmd").value) { log("type a command"); return; }
  try {
    const {tid} = await (await api("POST", `/v1/sessions/${sel}/tasks`, spec)).json();
    log(`task ${tid} queued`);
    for (let i = 0; i < 300; i++) {
      await new Promise(res => setTimeout(res, 250));
      const t = await (await api("GET", "/v1/tasks/" + tid)).json();
      if (t.status === "done") { show(t); log(`task ${tid} done`); return; }
    }
    log(`task ${tid} did not finish in time`);
  } catch (e) { log(e.message); }
}

function show(t) {
  const res = t.result || {};
  $("out").textContent =
    `[${t.tid}] ${t.kind} ${res.status || t.status} (${res.duration_ms || 0} ms)\n` +
    (res.stdout || res.detail || "");
}

async function kill() {
  if (!sel) { log("select a session first"); return; }
  if (!confirm("ask this agent to exit cleanly?")) return;
  try {
    await api("POST", `/v1/sessions/${sel}/tasks`, {kind: "exit", timeout: 5});
    log("exit task queued");
  } catch (e) { log(e.message); }
}

// SSE over fetch so the bearer token stays in a header, never in a URL.
async function sse() {
  if (!auth()) return;
  if (sseAbort) { sseAbort.abort(); }
  sseAbort = new AbortController();
  try {
    const r = await fetch("/v1/events", {
      headers: {"Authorization": "Bearer " + token, "Accept": "text/event-stream"},
      signal: sseAbort.signal,
    });
    const rd = r.body.getReader();
    const dec = new TextDecoder();
    let buf = "", type = "";
    for (;;) {
      const {value, done} = await rd.read();
      if (done) break;
      buf += dec.decode(value, {stream: true});
      let idx;
      while ((idx = buf.indexOf("\n")) >= 0) {
        const line = buf.slice(0, idx);
        buf = buf.slice(idx + 1);
        if (line.startsWith("event: ")) { type = line.slice(7); }
        else if (line.startsWith("data: ")) {
          if (type === "session.register" || type === "session.resume" ||
              type === "session.down" || type === "session.stale") {
            refresh();
          }
          log(type + " " + line.slice(6));
        }
      }
    }
  } catch (e) { if (e.name !== "AbortError") { log("sse: " + e.message); } }
}

$("token").addEventListener("change", () => { refresh(); sse(); });
</script>
</body>
</html>
